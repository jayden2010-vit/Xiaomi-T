<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi Tuner 4 Lite</title>
<style>
body {
background: #10151d;
color: white;
font-family: Arial, sans-serif;
padding: 20px;
}
.card {
background: #202a37;
padding: 18px;
border-radius: 14px;
margin: 15px 0;
}
button {
background: #36c98f;
color: #10151d;
border: 0;
border-radius: 10px;
padding: 15px;
font-weight: bold;
width: 100%;
margin-top: 10px;
font-size: 16px;
}
#log {
white-space: pre-wrap;
overflow-wrap: anywhere;
font-size: 13px;
}
small { color: #b8c4d2; }
</style>
</head>
<body>
<h1>🛴 Xiaomi Tuner 4 Lite</h1>
<p>Version 0.6 – Echte Roller-Suche</p>
<div class="card">
<h3>Bluetooth-Verbindung</h3>
<p id="status">Noch nicht verbunden</p>
<button id="connect">Xiaomi-Roller suchen</button>
</div>
<div class="card">
<h3>Roller-Informationen</h3>
<p>Gerät: <span id="device">Unbekannt</span></p>
<p>Software-Version: <span id="version">Unbekannt</span></p>
</div>
<div class="card">
<h3>Diagnose</h3>
<pre id="log">Bereit für die Suche.</pre>
</div>
<script>
const SERVICE = "0000fe95-0000-1000-8000-00805f9b34fb";
const CHAR = "00000004-0000-1000-8000-00805f9b34fb";
const statusEl = document.getElementById("status");
const deviceEl = document.getElementById("device");
const versionEl = document.getElementById("version");
const logEl = document.getElementById("log");
function log(message) {
logEl.textContent += "\n" + message;
}
document.getElementById("connect").addEventListener("click", async () => {
try {
logEl.textContent = "Suche nach echtem Xiaomi-Roller ...";
deviceEl.textContent = "Unbekannt";
versionEl.textContent = "Unbekannt";
if (!navigator.bluetooth) {
throw new Error("Dieser Browser unterstützt Bluetooth nicht.");
}
statusEl.textContent = "Suche läuft ...";
const device = await navigator.bluetooth.requestDevice({
filters: [
{ namePrefix: "xiaomi" }
],
optionalServices: [SERVICE]
});
if (!device.name ||
!device.name.toLowerCase().startsWith("xiaomi")) {
throw new Error("Das ausgewählte Gerät ist kein Xiaomi-Roller.");
}
deviceEl.textContent = device.name;
log("Gefunden: " + device.name);
statusEl.textContent = "Verbinde mit Roller ...";
const server = await device.gatt.connect();
log("Bluetooth-Verbindung hergestellt.");
statusEl.textContent = "Suche Roller-Daten ...";
const service = await server.getPrimaryService(SERVICE);
const characteristic = await service.getCharacteristic(CHAR);
const value = await characteristic.readValue();
const bytes = new Uint8Array(
value.buffer,
value.byteOffset,
value.byteLength
);
const version = new TextDecoder()
.decode(bytes)
.replace(/\0/g, "")
.trim();
versionEl.textContent = version || "Kein Wert";
log("FE95 erfolgreich gelesen.");
log("Software-Version: " + version);
statusEl.textContent = "Roller verbunden!";
} catch (error) {
statusEl.textContent = "Verbindung fehlgeschlagen";
log("Fehlername: " + (error.name || "Unbekannt"));
log("Fehlermeldung: " + (error.message || "Keine Details"));
if (error.name === "NotFoundError") {
log("Kein passender Xiaomi-Roller gefunden.");
}
}
});
</script>
</body>
</html>
