<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi Tuner 4 Lite</title>
<style>
body {
background: #10151d;
color: white;
font-family: Arial, sans-serif;
padding: 20px;
}
.card {
background: #202a37;
padding: 18px;
border-radius: 14px;
margin: 15px 0;
}
button {
background: #36c98f;
color: #10151d;
border: 0;
border-radius: 10px;
padding: 14px;
font-weight: bold;
width: 100%;
margin-top: 10px;
}
small { color: #b8c4d2; }
#log { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>🛴 Xiaomi Tuner 4 Lite</h1>
<p>Bluetooth Diagnose – Version 0.5</p>
<div class="card">
<h3>Verbindung</h3>
<p id="status">Noch nicht verbunden</p>
<button id="connect">Bluetooth verbinden</button>
</div>
<div class="card">
<h3>Roller-Informationen</h3>
<p>Gerät: <span id="device">Noch unbekannt</span></p>
<p>Version: <span id="version">Noch unbekannt</span></p>
</div>
<div class="card">
<h3>Diagnose</h3>
<pre id="log">Bereit.</pre>
</div>
<script>
const SERVICE = "0000fe95-0000-1000-8000-00805f9b34fb";
const CHAR = "00000004-0000-1000-8000-00805f9b34fb";
const statusEl = document.getElementById("status");
const deviceEl = document.getElementById("device");
const versionEl = document.getElementById("version");
const logEl = document.getElementById("log");
function log(text) {
logEl.textContent += "\n" + text;
}
document.getElementById("connect").addEventListener("click", async () => {
try {
if (!navigator.bluetooth) {
throw new Error("Bluetooth wird von diesem Browser nicht unterstützt.");
}
statusEl.textContent = "Bluetooth-Auswahl wird geöffnet …";
const device = await navigator.bluetooth.requestDevice({
acceptAllDevices: true,
optionalServices: [SERVICE]
});
deviceEl.textContent = device.name || "Unbekanntes Gerät";
log("Ausgewählt: " + device.name);
statusEl.textContent = "Verbinde …";
const server = await device.gatt.connect();
statusEl.textContent = "Verbunden";
const service = await server.getPrimaryService(SERVICE);
const characteristic = await service.getCharacteristic(CHAR);
const value = await characteristic.readValue();
const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
const version = new TextDecoder().decode(bytes).replace(/\0/g, "").trim();
versionEl.textContent = version || "Kein Wert";
log("FE95 erfolgreich gelesen.");
log("Version: " + version);
} catch (error) {
statusEl.textContent = "Verbindung fehlgeschlagen";
log("Fehler: " + error.message);
}
});
</script>
</body>
</html>
